name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arccivs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Verify arc-core consumer architecture
        uses: alexey-va/arc-core/.github/actions/verify-consumer@7e91f8fe9e8e509d5cf4f3d7e95512931a027bf6
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Unit and disposable MySQL tests, production JAR
        run: ./gradlew --no-daemon --build-cache test integrationTest shadowJar
      - name: Verify production artifact
        id: artifact
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/verify-jar.py --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArcCivs-${{ github.sha }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
