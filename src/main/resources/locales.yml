  building-purpose:
    town_hall: 'The town hall sets the population limit and town size. Once built, its scribes turn 3 paper and 1 leather into a book.'
    warehouse: 'Couriers carry supplies to building sites and workshops, then collect their products. Chests and barrels inside the warehouse connect automatically.'
    house: 'Residents sleep and form families in a house. A child needs two adults and a free population slot.'
    forester: 'Foresters cut nearby trees and plant replacements. Keep saplings and axes in the forester barrel.'
    quarry: 'One miner deepens the shaft and carves underground tunnels. Upgrades increase mining depth and yield quality. Supports, ladders and lighting require supplies.'
    farm: 'Farmers plant and harvest crops, with free automatic watering. Keep a hoe and seeds in the barrel. Bone meal is optional for fertilizing.'
    builder_hut: 'Builders work together on one construction. Assign the first resident to the site to start with their own hut.'
    sawmill: 'Carpenters make wooden products for town requests. They choose orders and suitable inputs automatically; sawmill upgrades unlock new products.'
    blacksmith: 'Blacksmiths make iron tools from stored ingots and sticks. Give a finished tool to a resident through their supplies.'
    stonemason: 'Stonemasons turn four stored stone blocks into four stone bricks for construction.'
    library: 'Librarians add a feather and ink to a book, making a book and quill that players can write in.'
    tavern: 'Four beds and one innkeeper who serves food from the tavern storage. Families form in houses.'
    bakery: 'Bakers turn three wheat into one bread. Ingredients and finished bread stay in the bakery barrel.'
    guard_tower: 'One guard keeps watch at the tower entrance.'
    wall: 'The wall marks the village boundary.'
    gate: 'A passage through the village wall.'
    road: 'A road connects building entrances.'
    plan_board: 'A village map with buildings, roads, gates and walls. In an autonomous village it shows the future layout followed by residents. Manage the board through the barrel below the map. It has no jobs.'
    university: 'One researcher works on the selected project. Put materials in the university barrel; completed research unlocks new production.'
    smeltery: 'The smelter makes charcoal, fires stone, and smelts iron and glass. Each batch needs its listed inputs; research unlocks recipes.'
    crusher: 'The crusher turns cobblestone into gravel, then gravel into sand. Inputs and finished batches are stored in the building barrel.'
    decoration: 'A fountain, park, wall or another decorative build. The builder uses real materials; this building has no jobs or production.'
