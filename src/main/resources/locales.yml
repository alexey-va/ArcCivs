  building-purpose:
    town_hall: 'Ратуша задаёт предел жителей и размер города. После постройки здесь работают писари: 3 бумаги и 1 кожа превращаются в книгу.'
    warehouse: 'Кладовщики относят сырьё со склада на стройки и в мастерские, затем собирают готовую продукцию. Сундуки и бочки внутри склада подключаются автоматически.'
    house: 'В доме жители спят и создают семьи. Для ребёнка нужны двое взрослых и свободное место в городе.'
    forester: 'Лесорубы рубят деревья рядом с лесорубкой и высаживают новые. Саженцы и топоры нужны в её бочке.'
    quarry: 'Один шахтёр углубляет шахту и прокладывает подземные туннели. С улучшением растут глубина и качество добычи. Для креплений, лестниц и света нужны материалы.'
    farm: 'Фермеры сажают и собирают урожай, полив бесплатный и автоматический. Мотыга и семена — в бочку. Для подкормки можно добавить костную муку.'
    builder_hut: 'Строители вместе возводят одну постройку. На участок можно назначить первого жителя: он начнёт со своего дома.'
    sawmill: 'Плотники делают деревянные изделия для заявок города. Сами выбирают заказ и подходящее сырьё; новые изделия открываются с улучшением лесопилки.'
    blacksmith: 'Кузнецы делают железные инструменты из слитков и палок со склада. Готовый инструмент можно выдать жителю через его припасы.'
    stonemason: 'Каменотёсы делают четыре каменных кирпича из четырёх блоков камня со склада. Кирпичи пригодятся для строительства.'
    library: 'Библиотекари добавляют к обычной книге перо и чернила. Получится книга с пером, в которой игрок сможет писать.'
    tavern: 'Четыре спальных места и один трактирщик, который подаёт еду из запасов таверны. Семьи создаются в жилых домах.'
    bakery: 'Пекари превращают три единицы пшеницы в один хлеб. Сырьё и готовый хлеб хранятся в бочке пекарни.'
    guard_tower: 'Один страж дежурит у входа в башню.'
    wall: 'Ограда обозначает границу деревни.'
    gate: 'Проход через ограду деревни.'
    road: 'Дорога соединяет входы в постройки.'
    plan_board: 'Карта поселения с домами, дорогами, воротами и стенами. В автономной деревне показывает будущую застройку, по которой работают жители. Управление — через бочку под картой. Рабочих мест здесь нет.'
    university: 'Один исследователь ведёт выбранный проект. Материалы нужны в бочке университета; завершённые исследования открывают новые производства.'
    smeltery: 'Плавильщик делает древесный уголь, обжигает камень, выплавляет железо и стекло. Для каждой партии нужны сырьё и топливо; рецепты открываются исследованиями.'
    crusher: 'Дробильщик превращает булыжник в гравий, затем гравий в песок. Сырьё и готовая партия хранятся в бочке здания.'
    decoration: 'Фонтан, парк, стена или другая декоративная постройка. Строитель расходует реальные материалы; рабочих мест и производства здесь нет.'
