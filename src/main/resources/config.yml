locale: ru
force-language: ru
use-client-locale: false
presentation:
  # Enable only with the matching server resource pack; empty keeps native text.
  font: ''
# Required per backend. Fill this and the shared MySQL tuple before enabling.
server-id: ''
mysql:
  host: ''
  port: 3306
  database: ''
  username: ''
  password: ''
  ssl-mode: VERIFY_IDENTITY
  pool:
    minimum-idle: 1
    maximum-size: 8
    connection-timeout-ms: 10000
    socket-timeout-ms: 30000
    validation-timeout-ms: 5000
    max-lifetime-ms: 1700000
  fail-fast: false
schematics-root: /home/freedeeml/McFine/arc_schematics
allowed-worlds: [vanilla, survival]
settlement-radius: 96
maximum-settlements: 500
maximum-building-volume: 50000
maximum-previews: 4
preview-seconds: 120
maximum-active-npcs: 48
npc-viewer-range: 96
chunk-loading:
  maximum-chunks: 2048
navigation:
  # Detached A* nodes per worker batch; each node needs several surrounding block reads.
  nodes-per-batch: 256
  maximum-nodes: 4096
  maximum-captured-blocks: 32768
  maximum-jobs: 48
  close-route-distance: 16.0
  # Try a narrow corridor first, then reuse its frontier for wider detours.
  initial-horizontal-margin: 4
  initial-vertical-margin: 2
  # Hard preparation deadlines in server ticks; reaching one never permits a teleport.
  close-preparation-ticks: 80
  preparation-ticks: 320
native-work:
  # Shared by all queued native work, including geometry capture. Whichever limit is hit first wins.
  operations-per-tick: 10000
  budget-millis: 4.0
worksites:
  # Aggregate discovery quotas per pulse across all residents, with an additional wall-time limit.
  standing-checks-per-pulse: 32
  ray-checks-per-pulse: 8
  mine-checks-per-pulse: 24
  # Minimum128: one accepted forestry batch contains up to128 cells.
  forest-work-units-per-pulse: 192
  maximum-forest-columns-per-pulse: 16
  budget-millis: 2.0
npc-voices:
  # Enable together with the resource pack that defines male1/female1 idle/work/greet events.
  enabled: false
  event-prefix: 'arccivs:citizen'
