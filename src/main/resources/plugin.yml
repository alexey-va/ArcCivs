name: ArcCivs
version: '${version}'
main: ru.arc.civs.ArcCivsPlugin
api-version: '1.21.11'
authors: [RusCrafting]
description: Player settlements, construction and working citizens
depend: [ArcCore, packetevents, WorldEdit]
softdepend: [Lands, Trails, ItemsAdder, LuckPerms]
commands:
  civs:
    aliases: [city]
    description: Manage your settlement
    usage: /civs [preview|status|reload]
    permission: arccivs.use
permissions:
  arccivs.use:
    description: Found and manage a settlement
    default: true
  arccivs.admin:
    description: Inspect and recover settlements
    default: op
  arccivs.chunkload:
    description: Keep the owner's settlement loaded and residents active without nearby players
    default: false
  arccivs.testing:
    description: Configure testing settings for the owner's settlement, including resident immortality and construction material grants
    default: false
